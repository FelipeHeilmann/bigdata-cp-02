version: '3.7'
services:
  mongo:
    image: 'mongo'
    container_name: 'mongo'
    hostname: 'mongo'
    domainname: 'books.com'
    restart: 'always'
    environment:
    - 'MONGO_INITDB_ROOT_USERNAME=user'
    - 'MONGO_INITDB_ROOT_PASSWORD=ZHNhZGFkYWRhc2Rh'
    ports:
    - '27017:27017'
    volumes:
    - 'mongo_data:/data/db'
volumes:
  mongo_data:
